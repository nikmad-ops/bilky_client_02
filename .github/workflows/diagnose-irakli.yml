name: Diagnose Irakli Bilky

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run safe diagnostics
        env:
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: node src/diagnose.js

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irakli-bilky-diagnostic
          path: irakli-workshift.png
          if-no-files-found: ignore
