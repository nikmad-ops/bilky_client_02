name: Bilky TEMP Preflight

on:
  push:
    paths:
      - 'src/preflight-temp.js'
      - '.github/workflows/preflight-temp.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run read-only preflight
        env:
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: node src/preflight-temp.js

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilky-preflight-${{ github.run_id }}
          path: |
            preflight-result.json
            diagnostics/
          if-no-files-found: ignore
          retention-days: 1
