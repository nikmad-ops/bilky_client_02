name: Bilky Status

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram chat id requesting status'
        required: true
        type: string
      mode:
        description: 'Compatibility input from Telegram dispatcher'
        required: false
        default: 'status'
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Authorize Telegram chat
        id: auth
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          CLIENT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${REQUEST_CHAT_ID}" = "${CLIENT_CHAT_ID}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "recipient=client" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${REQUEST_CHAT_ID}" = "${ADMIN_CHAT_ID}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "recipient=admin" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unauthorized Telegram chat_id."
          echo "allowed=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        if: steps.auth.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm config set audit false
          npm config set fund false
          npm config set fetch-retries 1
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 5000
          if ! timeout 90s npm install --prefer-offline --no-audit --no-fund; then
            echo "First npm install failed/timed out; retrying once..."
            timeout 90s npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Read Bilky weekly status
        id: run_status
        if: steps.auth.outputs.allowed == 'true'
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          CLIENT_NAME: 'Irakli'
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: npm run status

      - name: Telegram status
        if: success() && steps.auth.outputs.allowed == 'true'
        env:
          RECIPIENT: ${{ steps.auth.outputs.recipient }}
          CLIENT_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLIENT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=$(cat status-result.txt)

          if [ "${RECIPIENT}" = "admin" ]; then
            BOT_TOKEN="${ADMIN_BOT_TOKEN}"
            CHAT_ID="${ADMIN_CHAT_ID}"
          else
            BOT_TOKEN="${CLIENT_BOT_TOKEN}"
            CHAT_ID="${CLIENT_CHAT_ID}"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${CHAT_ID}" --arg text "${REPORT}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" >/dev/null

      - name: Telegram status failure
        if: failure() && steps.auth.outputs.allowed == 'true'
        env:
          RECIPIENT: ${{ steps.auth.outputs.recipient }}
          CLIENT_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLIENT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="❌ Bilky for Irakli STATUS. ERROR"

          if [ "${RECIPIENT}" = "admin" ]; then
            BOT_TOKEN="${ADMIN_BOT_TOKEN}"
            CHAT_ID="${ADMIN_CHAT_ID}"
          else
            BOT_TOKEN="${CLIENT_BOT_TOKEN}"
            CHAT_ID="${CLIENT_CHAT_ID}"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg chat_id "${CHAT_ID}" --arg text "${MESSAGE}" '{chat_id:$chat_id,text:$text}')" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" >/dev/null || true

      - name: Upload Bilky diagnostics
        if: always() && steps.auth.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilky-status-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/
            status-result.txt
            status-error.txt
          if-no-files-found: ignore
          retention-days: 14
